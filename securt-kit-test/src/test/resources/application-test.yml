server:
  port: 8098

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    schema: classpath:db/schema.sql

  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql


# 安全工具包配置
securt-kit:
  encryptor:
    enabled: true
    pattern-type: pojo
    secretKey: test-secret-key-123456
    scanEntityPackage:
      - com.chu7.securtkit.test
    cacheCapacity: 100
  # POJO模式配置
  param-encrypt-enabled: true
  result-decrypt-enabled: true
  pojo-mode:
    enabled: true
    default-strategy: DES

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

# 日志配置
logging:
  level:
    com.chu7.securtkit: DEBUG
    org.springframework: INFO
