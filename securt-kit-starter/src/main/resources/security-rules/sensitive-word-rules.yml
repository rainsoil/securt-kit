name: "Custom Sensitive Word Filtering Rules"
description: "Custom sensitive word filtering rules for specific requirements"
version: "1.0.0"
enabled: true

rules:
  - id: "sensitive-custom-political"
    name: "Custom Political Sensitive Words"
    description: "Filter custom political sensitive words"
    type: "SENSITIVE_WORD"
    enabled: true
    priority: 5
    action: "REPLACE"
    replacement: "***"
    patterns:
      - "政治敏感词"
      - "政府敏感词"
      - "国家敏感词"
      - "领导人敏感词"
    exclude-patterns:
      - "/api/admin/**"
      - "/api/system/**"
    exclude-params:
      - "adminContent"
      - "systemLog"

  - id: "sensitive-custom-violence"
    name: "Custom Violence Sensitive Words"
    description: "Filter custom violence sensitive words"
    type: "SENSITIVE_WORD"
    enabled: true
    priority: 10
    action: "REPLACE"
    replacement: "***"
    patterns:
      - "暴力敏感词"
      - "血腥敏感词"
      - "恐怖敏感词"
      - "爆炸敏感词"
    exclude-params:
      - "violenceContent"

  - id: "sensitive-custom-pornography"
    name: "Custom Pornography Sensitive Words"
    description: "Filter custom pornography sensitive words"
    type: "SENSITIVE_WORD"
    enabled: true
    priority: 15
    action: "REPLACE"
    replacement: "***"
    patterns:
      - "色情敏感词"
      - "黄色敏感词"
      - "成人敏感词"
      - "裸体敏感词"
    exclude-params:
      - "pornContent"

  - id: "sensitive-custom-business"
    name: "Custom Business Sensitive Words"
    description: "Filter custom business sensitive words"
    type: "SENSITIVE_WORD"
    enabled: true
    priority: 20
    action: "REPLACE"
    replacement: "***"
    patterns:
      - "商业敏感词"
      - "金融敏感词"
      - "投资敏感词"
      - "股票敏感词"
    exclude-params:
      - "businessContent"

global-config:
  default-action: "REPLACE"
  default-replacement: "***"
  case-sensitive: false
  log-level: "WARN"
