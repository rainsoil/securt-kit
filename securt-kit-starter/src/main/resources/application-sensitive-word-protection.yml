# 敏感词过滤配置示例
# 不需要敏感词关键字配置，直接通过读取配置文件获取关键字

securt-kit:
  safety:
    enabled: true
    sensitive-word:
      enabled: true
      enable-builtin: true
      
      # URL白名单配置
      url-whitelist:
        enabled: true
        allowed-urls:
          - "/api/public/**"           # 公开API接口
          - "/static/**"               # 静态资源
          - "/health"                  # 健康检查
          - "/actuator/**"             # Spring Boot Actuator
          - "/swagger-ui/**"           # Swagger UI
          - "/v3/api-docs/**"          # OpenAPI文档
          - "/favicon.ico"             # 网站图标
          - "/robots.txt"              # 搜索引擎爬虫文件
          - "/api/content/**"          # 内容管理API接口
          - "/api/media/**"            # 媒体文件API接口
      
      # IP白名单配置
      ip-whitelist:
        enabled: true
        enable-builtin: true
        # 外部IP白名单配置文件路径列表
        config-files:
          - "sensitive-word-whitelist/custom/trusted-ips.txt"
          - "sensitive-word-whitelist/custom/internal-ips.txt"
        # 直接配置的IP白名单列表
        allowed-ips:
          - "127.0.0.1"               # 本地回环地址
          - "192.168.1.0/24"          # 内网网段
          - "10.0.0.0/8"              # 私有网段A
          - "172.16.0.0/12"           # 私有网段B
          - "::1"                     # IPv6本地回环

# 日志配置
logging:
  level:
    com.chu7.securtkit.safety: DEBUG
    root: INFO

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# 配置说明：
# 1. 是否开启：enabled - 控制整个功能是否启用
# 2. 是否开启内置规则：enable-builtin - 控制是否加载内置规则文件
# 3. 外部配置文件路径列表：config-files - 指定外部配置文件路径
# 4. URL白名单列表：allowed-urls - 直接配置的URL白名单
# 5. IP白名单列表：allowed-ips - 直接配置的IP白名单

# 敏感词关键字配置说明：
# - 不需要在配置文件中配置敏感词关键字
# - 系统会自动读取内置关键字文件：sensitive-word-keywords/builtin/sensitive-word-keywords.txt
# - 系统会自动读取外部关键字文件：
#   - sensitive-word-keywords/custom/my-sensitive-keywords.txt
#   - sensitive-word-keywords/custom/custom-sensitive-patterns.txt
# - 可以通过代码动态设置检测模式和替换字符：
#   - SensitiveWordKeywordsManager.setDetectionMode("strict")
#   - SensitiveWordKeywordsManager.setReplaceChar("#")

# 示例：自定义IP白名单文件内容
# 文件路径：src/main/resources/sensitive-word-whitelist/custom/trusted-ips.txt
# 内容示例：
# 192.168.1.100
# 192.168.1.101
# 10.0.0.50
# 172.16.0.10/24

# 示例：自定义敏感词关键字文件内容
# 文件路径：src/main/resources/sensitive-word-keywords/custom/my-sensitive-keywords.txt
# 内容示例：
# 政治
# 暴力
# 色情
# 赌博
# 毒品
# 恐怖
# 爆炸
# 杀人
# 死亡
# 自杀
